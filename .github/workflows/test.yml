name: Test lazyclaw

# Two-tier gate:
#   - node:  the node:test unit suite (tests/*.test.mjs) — the HARD gate.
#            552 assertions, green on Linux.
#   - playwright: the .spec.ts acceptance suite. Runs for visibility but is
#            non-blocking (continue-on-error) because ~35 interactive
#            chat/loop/goal specs fail on Linux/non-TTY today — a pre-existing
#            defect in the legacy readline chat loop, tracked in
#            docs/KNOWN-ISSUES.md and slated for the Phase D rewrite. Flip
#            playwright to a hard gate once that lands.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: node:test units (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run node:test suite
        run: node --test tests/*.test.mjs

  playwright:
    name: Playwright specs (non-blocking — see docs/KNOWN-ISSUES.md)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright acceptance specs
        run: npx playwright test
