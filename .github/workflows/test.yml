name: Test lazyclaw

# Two-tier gate:
#   - node:  the node:test unit suite (tests/*.test.mjs) — the HARD gate.
#            590 tests, green on Linux.
#   - playwright: the .spec.ts acceptance suite. Runs for visibility but is
#            non-blocking (continue-on-error). The ~35 interactive chat/loop/
#            goal failures were fixed in D7 (b479886); the suite is now 666
#            pass / 6 fail on this runner, and the remaining 6 are the
#            phase6 providers/test specs that probe REAL external provider
#            endpoints (no API keys / network on CI). See docs/KNOWN-ISSUES.md.
#            Flip playwright to a hard gate once those 6 are made offline-safe
#            (skip-when-no-key or stubbed probes) — Phase F8.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: node:test units (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run node:test suite
        run: node --test tests/*.test.mjs

  playwright:
    name: Playwright specs (non-blocking — see docs/KNOWN-ISSUES.md)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright acceptance specs
        run: npx playwright test
