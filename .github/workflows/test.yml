name: Test lazyclaw

# Two-tier gate — BOTH hard:
#   - node:       the node:test unit suite (tests/*.test.mjs).
#   - playwright: the .spec.ts acceptance suite. Promoted to a hard gate in
#                 F8. History: the ~35 interactive chat/loop/goal failures
#                 were a node-20 readline race fixed in D7 (b479886); the
#                 last 6 (phase6 provider-probe specs) crashed when no
#                 `claude` binary was present because the claude-cli provider
#                 left the async spawn 'error' event unhandled — fixed in
#                 b9050be. The suite is now green offline, so it blocks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: node:test units (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: File-size lint gate (D8 — locks module sizes)
        run: node scripts/lint-file-size.mjs
      - name: Pack-completeness gate (every relative import must be shipped)
        run: node scripts/check-pack.mjs
      - name: Run node:test suite
        run: node --test tests/*.test.mjs

  playwright:
    name: Playwright acceptance specs (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright acceptance specs
        run: npx playwright test
