<!doctype html>
<!--
  pompos dashboard — a single-file-entry SPA served by `pompos daemon`.
  Deliberately framework-free: vanilla DOM, vanilla fetch, no build step.
  The shell is a grouped sidebar (6 groups / 21 panels) with the URL hash as
  the source of truth for the active panel, plus a mobile drawer under
  820px. Panel bodies live in web/ui/panels/*.mjs (dashboard-shell-motion
  Task 4); dashboard.js just mounts the shell.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pompos</title>
  <!-- Absolute paths: the daemon serves this page at /dashboard AND /dashboard/
       (and /), so a relative href would resolve to /dashboard/dashboard.css and
       404 — leaving the page unstyled with every tab stuck on "Loading…". -->
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="icon" type="image/png" sizes="16x16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAANUlEQVR42mO4uTkKDXEhAUxZBjyqseqhTAMXDkAlDVx4Af01cBEBKNDARTQgSwMXiWAQagAAvAio8bGVvw0AAAAASUVORK5CYII=">
  <link rel="icon" type="image/png" sizes="32x32" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAIAAAD8GO2jAAAARUlEQVR42u3NwQkAIAwEwbyvRNu0GruxAknUBBF2ue8xNnpzp0WRrz0GFAigCtBmAJmALgIAUFIAJ4AKAogCKg4A4ANgAugpo9+8A9VxAAAAAElFTkSuQmCC">
</head>
<body>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Sections">
      <div id="nav-marker" hidden></div>
      <div class="brand"><b>pompos</b><span id="version">…</span></div>
      <div id="nav-groups"></div>
    </nav>

    <div class="stage">
      <div class="topbar">
        <button type="button" class="burger" id="burger" aria-label="Open sections"
                aria-expanded="false" aria-controls="rail">≡</button>
        <button type="button" class="omni" id="omni">
          <span aria-hidden="true">⌕</span> Search panels, teams, or run a command
          <kbd>⌘K</kbd>
        </button>
        <div class="daemon"><span class="beacon" aria-hidden="true"></span> <span id="daemon-state">connecting…</span></div>
      </div>

      <div class="liverail" id="liverail">
        <span class="liverail-label">Live</span>
        <div id="ticker" aria-live="polite" aria-atomic="true"></div>
        <span class="rail-stat">today <b id="rs-cost">$0.00</b></span>
      </div>

      <main><div id="host"></div></main>
    </div>
  </div>

  <!-- Outside .shell on purpose: inside it this takes the grid's second
       column and pushes .stage onto a second row. -->
  <div id="rail-scrim"></div>

  <div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-label="Command palette">
    <div id="palette">
      <input id="q" type="text" placeholder="Search panels, teams, or run a command…"
             autocomplete="off" spellcheck="false">
      <ul id="results"></ul>
      <div class="pal-foot"><span>↑↓ move</span><span>↵ open</span><span>esc close</span></div>
    </div>
  </div>

  <div class="scrim" id="modal-scrim" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <button type="button" class="modal-x" id="modal-x" aria-label="Close">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>

  <script type="module" src="/dashboard.js"></script>
</body>
</html>
